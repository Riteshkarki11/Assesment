<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Ritesh Karki | Developer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12 glass p-8 rounded-3xl">
            <div>
                <h1 id="userName" class="text-4xl font-bold text-white mb-2">Loading...</h1>
                <div class="flex gap-4 items-center text-slate-400">
                    <span id="userEmail"></span>
                    <a id="linkedinLink" href="#" target="_blank" class="text-blue-400 hover:text-blue-300">LinkedIn</a>
                </div>
            </div>
            <div id="topSkills" class="flex gap-2"></div>
        </header>

        <div class="mb-12">
            <input type="text" id="searchInput" onkeyup="search()" placeholder="Filter projects by skill..." 
                   class="w-full p-5 rounded-2xl bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none text-lg">
        </div>

        <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        async function init() {
            try {
                const profile = await fetch(`${API}/profile`).then(r => r.json());
                document.getElementById('userName').innerText = profile.name;
                document.getElementById('userEmail').innerText = profile.email;
                document.getElementById('linkedinLink').href = profile.links.linkedin;
                
                const skills = await fetch(`${API}/skills/top`).then(r => r.json());
                document.getElementById('topSkills').innerHTML = skills.top_skills.map(s => 
                    `<span class="px-4 py-1.5 bg-blue-500/10 text-blue-400 rounded-full text-sm border border-blue-500/20">${s}</span>`
                ).join('');
                
                search();
            } catch (e) { console.error("Make sure your FastAPI server is running!", e); }
        }

        async function search() {
            const q = document.getElementById('searchInput').value;
            const projects = await fetch(`${API}/projects${q ? '?skill='+q : ''}`).then(r => r.json());
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = projects.map(p => `
                <div class="glass p-8 rounded-3xl hover:border-blue-500/40 transition-all">
                    <h3 class="text-2xl font-bold mb-3 text-white">${p.title}</h3>
                    <p class="text-slate-400 mb-6 leading-relaxed">${p.description}</p>
                    <div class="flex flex-wrap gap-3">
                        ${p.tech_stack.map(t => `<span class="text-xs font-mono text-slate-500 bg-slate-900 px-2 py-1 rounded">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
